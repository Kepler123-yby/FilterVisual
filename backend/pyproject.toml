[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filtervisual"
version = "1.0.0"
description = "Reproducible four-armor motion and filtering laboratory"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "fastapi==0.143.1", "pydantic==2.14.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
